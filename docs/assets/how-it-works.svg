<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1050" viewBox="0 0 380 798" role="img" aria-labelledby="pd-title pd-desc">
  <title id="pd-title">How the Hermes portal works</title>
  <desc id="pd-desc">A portal job inside your existing Hermes profile wakes your usual assistant on your chosen schedule. The same assistant investigates authorised sources with its usual capabilities, chooses useful work, acts and verifies or keeps approval-required work pending, preserves progress and corrections, then notifies only when useful and allowed or stays quiet. The next wake reads that continuity, using the same sources and reachability as a normal Hermes session.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .pd-bg { fill: #FBFAF7; }
    .pd-panel { fill: #F4F2EC; stroke: #C7C3B8; stroke-width: 1; }
    .pd-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .pd-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .pd-neutral { fill: #FBFAF7; stroke: #6F6C64; stroke-width: 1; stroke-dasharray: 4 3; }
    .pd-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #1F2328; }
    .pd-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #3F3F3B; }
    .pd-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #4A4A46; }
    .pd-return { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #534AB7; }
    .pd-line { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .pd-teal-line { stroke: #0F6E56; }
    .pd-purple-line { stroke: #534AB7; }
    .pd-neutral-line { stroke: #6F6C64; }

    @media (prefers-color-scheme: dark) {
      .pd-bg { fill: #15171C; }
      .pd-panel { fill: #1D2026; stroke: #3D424C; }
      .pd-teal { fill: #12352C; stroke: #5DCAA5; }
      .pd-purple { fill: #26215C; stroke: #AFA9EC; }
      .pd-neutral { fill: #1D2026; stroke: #8D93A1; }
      .pd-title { fill: #F2F1EC; }
      .pd-sub { fill: #D3D1C7; }
      .pd-label { fill: #C9C7BD; }
      .pd-return { fill: #AFA9EC; }
      .pd-teal-line { stroke: #5DCAA5; }
      .pd-purple-line { stroke: #AFA9EC; }
      .pd-neutral-line { stroke: #8D93A1; }
    }
  </style>

  <rect class="pd-bg" x="0" y="0" width="380" height="798"/>

  <text class="pd-title" x="20" y="24">Your usual Hermes, on your schedule</text>
  <text class="pd-sub" x="20" y="42">The portal adds wake-up and initiative —<tspan x="20" dy="15">not a second assistant.</tspan></text>

  <rect class="pd-panel" x="12" y="70" width="356" height="708" rx="16"/>
  <text class="pd-title" x="40" y="92">Your existing Hermes profile</text>
  <text class="pd-sub" x="40" y="110">usual tools, connectors, skills,<tspan x="40" dy="15">memory, permissions and approvals</tspan></text>

  <g class="pd-purple">
    <rect x="40" y="145" width="300" height="58" rx="10"/>
    <text class="pd-title" x="190" y="165" text-anchor="middle" dominant-baseline="central">Wake on your schedule</text>
    <text class="pd-sub" x="190" y="183" text-anchor="middle" dominant-baseline="central">portal adds wake-up + initiative</text>
  </g>

  <g class="pd-teal">
    <rect x="40" y="227" width="300" height="58" rx="10"/>
    <text class="pd-title" x="190" y="247" text-anchor="middle" dominant-baseline="central">Investigate authorised sources</text>
    <text class="pd-sub" x="190" y="265" text-anchor="middle" dominant-baseline="central">with your usual capabilities</text>
  </g>

  <g class="pd-teal">
    <rect x="40" y="309" width="300" height="58" rx="10"/>
    <text class="pd-title" x="190" y="329" text-anchor="middle" dominant-baseline="central">Choose useful work</text>
    <text class="pd-sub" x="190" y="347" text-anchor="middle" dominant-baseline="central">act on changes; skip repeats</text>
  </g>

  <g class="pd-line pd-teal-line">
    <line x1="190" y1="203" x2="190" y2="219" marker-end="url(#arrow)"/>
    <line x1="190" y1="285" x2="190" y2="301" marker-end="url(#arrow)"/>
  </g>

  <text class="pd-label" x="180" y="384" text-anchor="end">ordinary authority</text>

  <g class="pd-teal">
    <rect x="40" y="416" width="145" height="68" rx="10"/>
    <text class="pd-title" x="112.5" y="436" text-anchor="middle" dominant-baseline="central">Act + verify</text>
    <text class="pd-sub" x="112.5" y="454" text-anchor="middle" dominant-baseline="central">within authority</text>
    <text class="pd-sub" x="112.5" y="470" text-anchor="middle" dominant-baseline="central">read back result</text>
  </g>

  <g class="pd-neutral">
    <rect x="195" y="416" width="145" height="68" rx="10"/>
    <text class="pd-title" x="267.5" y="436" text-anchor="middle" dominant-baseline="central">Approval?</text>
    <text class="pd-sub" x="267.5" y="454" text-anchor="middle" dominant-baseline="central">keep pending;</text>
    <text class="pd-sub" x="267.5" y="470" text-anchor="middle" dominant-baseline="central">ask next step</text>
  </g>

  <line class="pd-line pd-teal-line" x1="190" y1="367" x2="190" y2="398"/>
  <line class="pd-line pd-neutral-line" x1="112.5" y1="398" x2="267.5" y2="398"/>
  <line class="pd-line pd-neutral-line" x1="112.5" y1="398" x2="112.5" y2="408" marker-end="url(#arrow)"/>
  <line class="pd-line pd-neutral-line" x1="267.5" y1="398" x2="267.5" y2="408" marker-end="url(#arrow)"/>

  <g class="pd-line pd-neutral-line">
    <line x1="112.5" y1="484" x2="112.5" y2="508"/>
    <line x1="267.5" y1="484" x2="267.5" y2="508"/>
    <line x1="112.5" y1="508" x2="267.5" y2="508"/>
  </g>
  <line class="pd-line pd-teal-line" x1="190" y1="508" x2="190" y2="524" marker-end="url(#arrow)"/>

  <g class="pd-teal">
    <rect x="40" y="532" width="300" height="58" rx="10"/>
    <text class="pd-title" x="190" y="552" text-anchor="middle" dominant-baseline="central">Preserve progress + corrections</text>
    <text class="pd-sub" x="190" y="570" text-anchor="middle" dominant-baseline="central">follow-up for the next wake</text>
  </g>

  <text class="pd-label" x="180" y="607" text-anchor="end">notify only if useful</text>

  <g class="pd-teal">
    <rect x="40" y="639" width="145" height="68" rx="10"/>
    <text class="pd-title" x="112.5" y="659" text-anchor="middle" dominant-baseline="central">Notify you</text>
    <text class="pd-sub" x="112.5" y="677" text-anchor="middle" dominant-baseline="central">if useful and</text>
    <text class="pd-sub" x="112.5" y="693" text-anchor="middle" dominant-baseline="central">gates allow</text>
  </g>

  <g class="pd-neutral">
    <rect x="195" y="639" width="145" height="68" rx="10"/>
    <text class="pd-title" x="267.5" y="659" text-anchor="middle" dominant-baseline="central">Stay quiet</text>
    <text class="pd-sub" x="267.5" y="677" text-anchor="middle" dominant-baseline="central">save it for</text>
    <text class="pd-sub" x="267.5" y="693" text-anchor="middle" dominant-baseline="central">the next wake</text>
  </g>

  <line class="pd-line pd-teal-line" x1="190" y1="590" x2="190" y2="621"/>
  <line class="pd-line pd-neutral-line" x1="112.5" y1="621" x2="267.5" y2="621"/>
  <line class="pd-line pd-neutral-line" x1="112.5" y1="621" x2="112.5" y2="631" marker-end="url(#arrow)"/>
  <line class="pd-line pd-neutral-line" x1="267.5" y1="621" x2="267.5" y2="631" marker-end="url(#arrow)"/>

  <g class="pd-line pd-neutral-line">
    <line x1="112.5" y1="707" x2="112.5" y2="739"/>
    <line x1="267.5" y1="707" x2="267.5" y2="739"/>
    <line x1="112.5" y1="739" x2="267.5" y2="739"/>
  </g>
  <path class="pd-line pd-purple-line" d="M112.5 739 H24 V174 H32" marker-end="url(#arrow)"/>
  <text class="pd-return" x="40" y="757">next wake reads continuity</text>
</svg>
